<style>:root{--or:#e6501d;--or-d:#b83a0d;--navy:#28235d;--pri:#28235d;--pri-h:#3a347a;--teal:#159f99;--teal-d:#0e7c77;--lime:#64b032;--mag:#af1757;--bg:#f6f5f3;--card:#fff;--ink:#1d2033;--mute:#5d6679;--line:#e4e2de;--soft:#f0eeea;--ok:#0d6836;--okbg:#e8f3ec;--warn:#8a4a00;--warnbg:#fff3df;--bad:#a3202a;--badbg:#fbe9ea;--r:14px;--sh:0 1px 2px rgba(40,35,93,.05),0 8px 24px rgba(40,35,93,.06)}
:root[data-theme=dark]{--bg:#12141f;--card:#1b1e2e;--ink:#eef0f4;--mute:#a7adbd;--line:#2c3045;--soft:#242840;--pri:#6c63d9;--pri-h:#7f77e6;--okbg:#10331f;--ok:#7fd99f;--warnbg:#3a2a10;--warn:#ffc27a;--badbg:#3b1b1e;--bad:#ff9da4;--teal-d:#5fd6cb;--or-d:#ff8a63;--sh:none}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12141f;--card:#1b1e2e;--ink:#eef0f4;--mute:#a7adbd;--line:#2c3045;--soft:#242840;--pri:#6c63d9;--pri-h:#7f77e6;--okbg:#10331f;--ok:#7fd99f;--warnbg:#3a2a10;--warn:#ffc27a;--badbg:#3b1b1e;--bad:#ff9da4;--teal-d:#5fd6cb;--or-d:#ff8a63;--sh:none}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 'Open Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
[hidden]{display:none!important}
a{color:var(--or-d)}button{font:inherit;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.top{background:#fff;color:var(--navy);position:sticky;top:0;z-index:20;box-shadow:0 1px 0 rgba(40,35,93,.08)}
.top .in{max-width:1180px;margin:auto;padding:8px 16px;display:flex;align-items:center;gap:12px}
.logo{display:block;height:46px;width:auto}
.top .sp{flex:1}.top button,.top a.btnl{background:#f0eeea;color:#28235d;border:0;border-radius:8px;padding:6px 14px;font-weight:600;text-decoration:none;font-size:14px}
.top button:hover{background:#e6e3dd}
.stripe{height:4px;background:linear-gradient(90deg,#e6501d 0 14.28%,#e89109 0 28.56%,#64b032 0 42.84%,#159f99 0 57.12%,#28235d 0 71.4%,#652680 0 85.68%,#af1757 0)}
main{max-width:1180px;margin:auto;padding:20px 16px 80px}
h1{font-size:26px;line-height:1.25;margin:0 0 6px;font-weight:800;color:var(--navy)}:root[data-theme=dark] h1{color:var(--ink)}@media (prefers-color-scheme:dark){:root:not([data-theme=light]) h1{color:var(--ink)}}h2{font-size:19px;margin:0 0 10px}h3{font-size:15px;margin:0 0 6px}
.mute{color:var(--mute)}.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--sh);margin-bottom:16px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp1{flex:1}
.auth{max-width:520px;margin:32px auto}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--line);margin:0 0 20px;-webkit-overflow-scrolling:touch}
.tabs button{background:none;border:0;padding:12px 16px;font-weight:600;color:var(--mute);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--or)}
.tabs .n{background:var(--or);color:#fff;border-radius:10px;padding:0 7px;font-size:12px;margin-inline-start:6px}
label.f{display:block;margin:0 0 14px}.f .l{display:block;font-weight:600;font-size:14px;margin-bottom:4px}.f .l i{color:var(--or-d);font-style:normal}
.f .h{display:block;font-size:12.5px;color:var(--mute);margin-top:3px}
input[type=text],input[type=email],input[type=tel],input[type=url],input[type=date],input[type=time],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:92px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--teal);outline:none;box-shadow:0 0 0 3px rgba(18,168,157,.25)}
.f.err input,.f.err select,.f.err textarea{border-color:var(--bad)}.f .e{color:var(--bad);font-size:12.5px;display:block;margin-top:3px}
.cnt{float:inline-end;font-weight:400;color:var(--mute);font-size:12px}
.btn{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--pri);background:var(--pri);color:#fff;cursor:pointer;border-radius:10px;padding:10px 20px;font-weight:700;min-height:44px;text-decoration:none}
.btn:hover{background:var(--pri-h);border-color:var(--pri-h)}.btn.s{background:transparent;color:var(--pri);border-color:var(--pri)}.btn.s:hover{background:var(--soft)}.btn.g{border-color:var(--line);background:var(--soft);color:var(--ink)}.btn.g:hover{background:var(--line);border-color:var(--line)}.btn.sm{padding:6px 12px;min-height:34px;font-size:14px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}.chip input{position:absolute;opacity:0;inset:0;cursor:pointer;width:100%;height:100%;margin:0}
.chip span{display:inline-block;padding:7px 14px;border-radius:20px;border:1.5px solid var(--line);background:var(--card);font-size:14px}
.chip input:checked+span{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.chip input:focus-visible+span{outline:3px solid var(--teal);outline-offset:2px}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.types .chip span{display:block;border-radius:12px;padding:10px 12px;font-weight:600}
.badge{display:inline-block;border-radius:12px;padding:2px 10px;font-size:12.5px;font-weight:700;background:var(--soft);color:var(--mute)}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.warn{background:var(--warnbg);color:var(--warn)}.badge.bad{background:var(--badbg);color:var(--bad)}.badge.or{background:var(--or);color:#fff}
.note{border-radius:12px;padding:12px 16px;margin:0 0 14px;background:var(--okbg);color:var(--ok)}.note.warn{background:var(--warnbg);color:var(--warn)}.note.bad{background:var(--badbg);color:var(--bad)}
.meter{height:10px;border-radius:5px;background:var(--soft);overflow:hidden}.meter i{display:block;height:100%;background:var(--teal);transition:width .3s}.meter.mid i{background:#c98a00}.meter.low i{background:var(--or)}
.steps{display:flex;gap:6px;margin:0 0 18px;overflow-x:auto}.steps button{flex:1;min-width:92px;border:0;background:var(--soft);color:var(--mute);border-radius:10px;padding:8px 6px;font-size:13px;font-weight:600}
.steps button[aria-current=step]{background:var(--pri);color:#fff}.steps button.done{background:var(--okbg);color:var(--ok)}
.split{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}.split aside{position:sticky;top:76px}
@media(max-width:900px){.split{grid-template-columns:1fr}.split aside{position:static}}
.hours{display:grid;grid-template-columns:54px 1fr 1fr auto;gap:8px;align-items:center;margin-bottom:6px}
@media(max-width:480px){.hours{grid-template-columns:44px 1fr 1fr}.hours label{grid-column:2/4}}
.ph{border:2px dashed var(--line);border-radius:12px;padding:14px;text-align:center;color:var(--mute);background:var(--soft)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.thumbs .t{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;background:var(--soft);border:1px solid var(--line)}
.thumbs img{width:100%;height:100%;object-fit:cover}.thumbs .t b{position:absolute;top:2px;inset-inline-end:2px;background:rgba(0,0,0,.65);color:#fff;border:0;border-radius:50%;width:22px;height:22px;line-height:20px;text-align:center;font-size:13px;cursor:pointer;padding:0}
.thumbs .t span{font-size:11px;padding:4px;display:block;word-break:break-all}
table.k{border-collapse:collapse;width:100%}.k td{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}.k td:first-child{color:var(--mute);width:38%;padding-inline-end:10px}
.thread{display:grid;gap:10px;margin:10px 0}.msg{padding:10px 14px;border-radius:12px;background:var(--soft);white-space:pre-wrap}.msg.team{background:var(--okbg);color:var(--ok)}.msg small{display:block;color:var(--mute);margin-bottom:2px}
#toast{position:fixed;inset-inline:16px;bottom:16px;max-width:460px;margin-inline:auto;z-index:60}#toast div{background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 16px;box-shadow:0 8px 30px rgba(0,0,0,.3);margin-top:8px}
/* public store page */
.sp-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sp-hero{height:190px;background:linear-gradient(135deg,#e6501d,#af1757 55%,#652680);background-size:cover;background-position:center;position:relative}
.sp-logo{width:84px;height:84px;border-radius:16px;background:#fff;border:3px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.18);position:absolute;bottom:-34px;inset-inline-start:20px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-weight:800;color:var(--navy);font-size:26px}
.sp-logo img{width:100%;height:100%;object-fit:contain}
.sp-body{padding:46px 20px 20px}.sp-body h1{margin:0}.sp-tag{color:var(--mute);margin:2px 0 10px}
.sp-acts{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.sp-gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}.sp-gal img{width:100%;height:110px;object-fit:cover;border-radius:10px}
.sp-offer{border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid;grid-template-columns:110px 1fr;margin-bottom:10px}.sp-offer img{width:110px;height:100%;object-fit:cover;min-height:90px}.sp-offer .b{padding:10px 14px}
.sp-offer.noimg{grid-template-columns:1fr}
.open{color:var(--ok);font-weight:700}.closed{color:var(--bad);font-weight:700}
.demo{background:#fff3df;color:#5b3a00;border-bottom:1px solid #f0d9ae;text-align:center;padding:8px 12px;font-size:13.5px;font-weight:600}
.modal{position:fixed;inset:0;background:rgba(10,14,22,.6);z-index:50;overflow:auto;padding:20px}.modal .in{max-width:720px;margin:auto}
dl.cl{margin:0}dl.cl dt{font-weight:700;margin-top:8px}
@media print{.top,.tabs,.btn,#toast{display:none!important}}

<script>/* ---- shared helpers (used by the portal and the public store page) ---- */
function h(tag, attrs) {

async function route() {
  document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.getElementById('lang').textContent = lang === 'ar' ? 'English' : 'عربي';
  clear(app).appendChild(h('p', { class: 'mute' }, _('Loading…')));
  const slug = decodeURIComponent((location.hash.match(/^#\/([a-z0-9-]+)/i) || [])[1] || '');

  try { slug ? await storePage(slug) : await directory(); } catch (e) { clear(app).appendChild(h('div', { class: 'note bad' }, e.message || String(e))); }

async function storePage(slug) {
  const r = await get('action=store&slug=' + encodeURIComponent(slug));
  if (!r.ok) throw new Error(_('We could not find that store.'));

  const box = h('div'); put(app, EMBED ? null : h('p', null, h('a', { href: '#/' }, '← ' + _('Back to all stores'))), box);

async function directory() {

  if (!a.ok) throw new Error(a.error);
  const stores = a.stores, offers = b.ok ? b.offers : []; let q = '', cat = '';
