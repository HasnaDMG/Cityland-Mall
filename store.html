<style>:root{--or:#e6501d;--or-d:#b83a0d;--navy:#28235d;--pri:#28235d;--pri-h:#3a347a;--teal:#159f99;--teal-d:#0e7c77;--lime:#64b032;--mag:#af1757;--bg:#f6f5f3;--card:#fff;--ink:#1d2033;--mute:#5d6679;--line:#e4e2de;--soft:#f0eeea;--ok:#0d6836;--okbg:#e8f3ec;--warn:#8a4a00;--warnbg:#fff3df;--bad:#a3202a;--badbg:#fbe9ea;--r:14px;--sh:0 1px 2px rgba(40,35,93,.05),0 8px 24px rgba(40,35,93,.06)}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp1{flex:1}
.auth{max-width:520px;margin:32px auto}

label.f{display:block;margin:0 0 14px}.f .l{display:block;font-weight:600;font-size:14px;margin-bottom:4px}.f .l i{color:var(--or-d);font-style:normal}
.f .h{display:block;font-size:12.5px;color:var(--mute);margin-top:3px}
input[type=text],input[type=email],input[type=tel],input[type=url],input[type=date],input[type=time],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}

.cnt{float:inline-end;font-weight:400;color:var(--mute);font-size:12px}

.btn:hover{background:var(--pri-h);border-color:var(--pri-h)}.btn.s{background:transparent;color:var(--pri);border-color:var(--pri)}.btn.s:hover{background:var(--soft)}.btn.g{border-color:var(--line);background:var(--soft);color:var(--ink)}.btn.g:hover{background:var(--line);border-color:var(--line)}.btn.sm{padding:6px 12px;min-height:34px;font-size:14px}

.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}

.meter{height:10px;border-radius:5px;background:var(--soft);overflow:hidden}.meter i{display:block;height:100%;background:var(--teal);transition:width .3s}.meter.mid i{background:#c98a00}.meter.low i{background:var(--or)}

.split{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}.split aside{position:sticky;top:76px}
@media(max-width:900px){.split{grid-template-columns:1fr}.split aside{position:static}}
.hours{display:grid;grid-template-columns:54px 1fr 1fr auto;gap:8px;align-items:center;margin-bottom:6px}

.ph{border:2px dashed var(--line);border-radius:12px;padding:14px;text-align:center;color:var(--mute);background:var(--soft)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.thumbs .t{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;background:var(--soft);border:1px solid var(--line)}
.thumbs img{width:100%;height:100%;object-fit:cover}.thumbs .t b{position:absolute;top:2px;inset-inline-end:2px;background:rgba(0,0,0,.65);color:#fff;border:0;border-radius:50%;width:22px;height:22px;line-height:20px;text-align:center;font-size:13px;cursor:pointer;padding:0}
.thumbs .t span{font-size:11px;padding:4px;display:block;word-break:break-all}

/* public store page */
.sp-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sp-hero{height:190px;background:linear-gradient(135deg,#e6501d,#af1757 55%,#652680);background-size:cover;background-position:center;position:relative}
.sp-logo{width:84px;height:84px;border-radius:16px;background:#fff;border:3px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.18);position:absolute;bottom:-34px;inset-inline-start:20px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-weight:800;color:var(--navy);font-size:26px}
.sp-logo img{width:100%;height:100%;object-fit:contain}
.sp-body{padding:46px 20px 20px}.sp-body h1{margin:0}.sp-tag{color:var(--mute);margin:2px 0 10px}
.sp-acts{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}

.sp-offer{border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid;grid-template-columns:110px 1fr;margin-bottom:10px}.sp-offer img{width:110px;height:100%;object-fit:cover;min-height:90px}.sp-offer .b{padding:10px 14px}
.sp-offer.noimg{grid-template-columns:1fr}
.open{color:var(--ok);font-weight:700}.closed{color:var(--bad);font-weight:700}
.demo{background:#fff3df;color:#5b3a00;border-bottom:1px solid #f0d9ae;text-align:center;padding:8px 12px;font-size:13.5px;font-weight:600}
.modal{position:fixed;inset:0;background:rgba(10,14,22,.6);z-index:50;overflow:auto;padding:20px}.modal .in{max-width:720px;margin:auto}
dl.cl{margin:0}dl.cl dt{font-weight:700;margin-top:8px}
@media print{.top,.tabs,.btn,#toast{display:none!important}}
/* v4: marketing portal touches */
.hero{display:flex;gap:22px;align-items:center;background:linear-gradient(135deg,var(--card),var(--soft));border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px;flex-wrap:wrap}
.ring{--p:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--teal) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none;transition:background .4s}

.todo{list-style:none;margin:0;padding:0;display:grid;gap:4px}.todo li.done{color:var(--ok);font-weight:600}.todo a{font-weight:600}
.card.win{background:linear-gradient(135deg,var(--okbg),var(--card));border-color:var(--teal)}
.card.sticky{position:sticky;bottom:8px;z-index:5;box-shadow:0 -6px 24px rgba(40,35,93,.12)}
.card.step h2 .n{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;font-size:14px;margin-inline-end:6px}
.tools{margin:6px 0 8px;gap:6px}.tools .emo{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:2px 8px;min-height:32px;font-size:16px}.tools .emo:hover{background:var(--soft)}
.drop{display:grid;gap:4px;place-items:center;text-align:center;border:2px dashed var(--line);border-radius:14px;padding:22px 14px;cursor:pointer;background:var(--soft);transition:border-color .2s,background .2s}.drop:hover,.drop:focus-within{border-color:var(--teal);background:var(--card)}
.more{margin:4px 0 14px}.more summary{cursor:pointer;font-weight:600;color:var(--navy);padding:6px 0}
.post{border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden;box-shadow:var(--sh)}
.ph-head{display:flex;align-items:center;gap:8px;padding:10px 12px}.ph-head img,.ph-head .av{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700}.ph-head small{color:var(--mute);margin-inline-start:auto}
.ph-img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--soft)}.ph-img.empty{display:grid;place-items:center;color:var(--mute);font-size:14px}
.ph-cap{padding:10px 12px 14px;font-size:14px;white-space:pre-wrap;word-break:break-word;max-height:210px;overflow:auto}
.miss{margin:8px 0 0;padding-inline-start:18px;font-size:13px;color:var(--warn)}
.thumb{width:56px;height:56px;border-radius:10px;object-fit:cover}
.tl{list-style:none;display:flex;gap:6px;margin:12px 0;padding:0;flex-wrap:wrap}.tl li{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute);flex:1;min-width:110px}
.tl li i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}.tl li.done i{background:var(--teal);color:#fff}.tl li.cur i{background:var(--navy);color:#fff}.tl li.cur{color:var(--ink);font-weight:700}
.btn.wait{position:relative}.btn.wait::after{content:"";width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;margin-inline-start:6px}@keyframes sp{to{transform:rotate(360deg)}}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:80}.confetti i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall 2s ease-in forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}
@media (prefers-reduced-motion:reduce){.confetti,.btn.wait::after{animation:none}.meter i,.ring{transition:none}}
.f.err .drop{border-color:var(--bad)}
</style></head><body>

<script>/* ---- shared helpers (used by the portal and the public store page) ---- */
function h(tag, attrs) {
  const el = document.createElement(tag);
  const kids = Array.prototype.slice.call(arguments, 2);
  if (attrs) Object.keys(attrs).forEach(k => {
    const v = attrs[k];
    if (v == null || v === false) return;
    if (k === 'class') el.className = v;
    else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else if (k === 'checked' || k === 'disabled' || k === 'selected' || k === 'hidden') { el[k] = !!v; }
    else el.setAttribute(k, v === true ? '' : v);
  });
  (function add(list) { list.forEach(c => { if (Array.isArray(c)) add(c); else if (c != null && c !== false) el.appendChild(c.nodeType ? c : document.createTextNode(String(c))); }); })(kids);
  return el;
}
function put(el) { const kids = Array.prototype.slice.call(arguments, 1); (function add(list) { list.forEach(c => { if (Array.isArray(c)) add(c); else if (c != null && c !== false) el.appendChild(c.nodeType ? c : document.createTextNode(String(c))); }); })(kids); return el; }
function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); return el; }
function safeHref(u) { u = String(u || '').trim(); return /^https?:\/\/[^\s"'<>]+$/i.test(u) ? u : ''; }
function socialHref(kind, v) {
  v = String(v || '').trim(); if (!v) return '';
  if (/^https?:\/\//i.test(v)) return safeHref(v);
  const id = v.replace(/^@/, '').replace(/[^A-Za-z0-9._\-]/g, '');
  if (!id) return '';
  return { instagram: 'https://instagram.com/', tiktok: 'https://tiktok.com/@', facebook: 'https://facebook.com/', snapchat: 'https://snapchat.com/add/' }[kind] + id;
}
function dubaiNow() {
  const p = {}; new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Dubai', weekday: 'short', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date()).forEach(x => { p[x.type] = x.value; });
  return { day: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].indexOf(p.weekday), min: (+p.hour) * 60 + (+p.minute) };
}
function toMin(s) { const m = /^(\d\d):(\d\d)$/.exec(s || ''); return m ? (+m[1]) * 60 + (+m[2]) : null; }
/** 'open' | 'closed' | '' (unknown) */
function openState(hours) {
  const n = dubaiNow(); if (n.day < 0) return '';
  const today = hours[n.day], prev = hours[(n.day + 6) % 7];
  const inRange = (x, now, isPrev) => { if (!x || x.x) return false; const o = toMin(x.o), c = toMin(x.c); if (o == null || c == null) return false; if (c > o) return !isPrev && now >= o && now < c; return isPrev ? now < c : now >= o; };
  if (!hours.some(x => !x.x && x.o && x.c)) return '';
  return inRange(today, n.min, false) || inRange(prev, n.min, true) ? 'open' : 'closed';
}
const DAYNAMES = { en: ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'], ar: ['الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت', 'الأحد'] };
function fmtD(iso, lang) { if (!iso) return ''; const d = new Date(iso + 'T00:00:00'); return isNaN(d) ? iso : d.toLocaleDateString(lang === 'ar' ? 'ar-AE' : 'en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); }

/** Draws a store page into root. data = {store, offers}. Used for the live preview and the public page. */
function renderStore(root, data, tr, lang) {
  tr = tr || (x => x);
  const s = data.store; clear(root);
  const hero = h('div', { class: 'sp-hero' });
  if (s.hero && safeHref(s.hero.url)) hero.style.backgroundImage = 'url("' + safeHref(s.hero.url) + '"),linear-gradient(135deg,#28235d,#159f99)';
  const logo = h('div', { class: 'sp-logo' }, s.logo && safeHref(s.logo.url) ? h('img', { src: s.logo.url, alt: '' }) : (s.brand || '?').slice(0, 2).toUpperCase());
  hero.appendChild(logo);
  const st = openState(s.hours || []);
  const acts = h('div', { class: 'sp-acts' });
  const link = (label, href, solid) => href ? acts.appendChild(h('a', { class: 'btn sm' + (solid ? '' : ' s'), href: href, target: '_blank', rel: 'noopener noreferrer' }, label)) : null;
  link(tr('Call'), s.phone ? 'tel:' + s.phone.replace(/[^+\d]/g, '') : '', true);
  link('WhatsApp', s.whatsapp ? 'https://wa.me/' + s.whatsapp.replace(/\D/g, '') : '', false);
  link(tr('Website'), safeHref(s.website), false); link(tr('Menu or catalogue'), safeHref(s.menuUrl), false);
  if (s.ctaLabel && safeHref(s.ctaUrl)) link(s.ctaLabel, safeHref(s.ctaUrl), true);
  ['instagram', 'tiktok', 'facebook', 'snapchat'].forEach(k => link({ instagram: 'Instagram', tiktok: 'TikTok', facebook: 'Facebook', snapchat: 'Snapchat' }[k], socialHref(k, s[k]), false));
  const body = h('div', { class: 'sp-body' },
    h('h1', null, s.brand || tr('Your store name')),
    s.tagline ? h('div', { class: 'sp-tag' }, s.tagline) : null,
    h('div', { class: 'row small' }, [s.category, s.subcategory, data.unit ? tr('Unit') + ' ' + data.unit : '', s.floor].filter(Boolean).map(x => h('span', { class: 'badge' }, x)),
      st ? h('span', { class: st === 'open' ? 'open' : 'closed' }, st === 'open' ? tr('Open now') : tr('Closed now')) : null),
    acts,
    s.about ? h('p', null, s.about) : h('p', { class: 'mute' }, tr('Your description appears here.')),
    (s.tags || []).length ? h('div', { class: 'chips', style: 'margin-bottom:14px' }, s.tags.map(t => h('span', { class: 'badge ok' }, t))) : null);
